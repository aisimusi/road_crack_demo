[crackmamba]
# CrackMamba 项目根目录。相对路径会基于 backend/ 目录解析。
root = ../CrackMamba

# 使用启动后端时激活的 Conda 环境。
python = python

# 相对路径会基于 root 解析。
script = tools/batch_infer_crack_images.py
checkpoint = CrackSeg9k_checkpoint_best.pth
device = cuda
batch_size = 2

[classifier]
# 裂缝类型分类器。默认复用 CrackMamba 的 conda 环境和 GPU。
enabled = true
python = python
script = ../scripts/classify_crack_crops.py
checkpoint = ../models/uapd_crack_classifier_efficientnet_v2_s.pt
device = cuda
batch_size = 16
min_confidence = 0.55
embedding_enabled = true
embedding_model_name = efficientnet_penultimate
embedding_similarity_threshold = 0.8
embedding_margin_threshold = 0.05

[detection]
# 视频抽帧频率，单位 FPS。
frame_sample_fps = 2

# 同一裂缝去重阈值。
dedup_distance_m = 1.0
dedup_time_seconds = 3.0

# 相邻帧裂缝本体形状特征去重阈值。
# shape IoU/Dice 越大越严格；方向角容差越小越严格。
dedup_shape_iou_threshold = 0.18
dedup_shape_dice_threshold = 0.48
dedup_center_distance_ratio = 0.45
dedup_orientation_degrees = 45

# 散点/小块误检过滤阈值，单位为像素。
mask_min_area_px = 45
mask_noise_min_area_px = 10
mask_connect_gap_px = 100
mask_connect_line_width_px = 3
mask_min_component_area_px = 20
mask_min_component_length_px = 15
mask_min_component_elongation = 1.5

# 跨批次裂缝身份匹配阈值。
identity_match_distance_m = 3.0
identity_shape_dice_threshold = 0.42
identity_area_ratio_min = 0.25
identity_orientation_degrees = 55
identity_candidate_distance_m = 12.0
identity_geo_score_distance_m = 6.0

[dji_camera]
# DJI 相机传感器尺寸，单位 mm，用于把像素尺度估算为实际尺寸。
# 视频是 16:9，常用有效成像区域近似
sensor_width_mm = 6.4
sensor_height_mm = 3.6

# SRT 中的 focal_len 按官网说明视为 35mm 等效焦距。
focal_length_is_35mm_equivalent = true

# 官网焦距: 21-75 mm，等效焦距: 113-405 mm。
# 用 21 / 113 将 SRT 等效焦距换算为实际物理焦距。
physical_focal_min_mm = 21
equivalent_focal_min_mm = 113
